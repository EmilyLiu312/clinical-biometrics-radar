name: Deploy

on:
  push:
    branches: [main]
  # GITHUB_TOKEN 推的 commit 不会触发 push 事件，所以 ingest 合并完要显式再部署一次
  workflow_run:
    workflows: ["Ingest items"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate data.json
        run: python3 scripts/merge_items.py --check

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html data.json _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
